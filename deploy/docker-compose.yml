version: '3.8'

# Base configuration - use with environment-specific overrides
# For development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# For production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Frontend base service
  frontend:
    image: nstyle/frontend:latest
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - nstyle-network
    restart: unless-stopped

  # Testing service
  test-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    volumes:
      - ../frontend:/app:cached
      - test-node-modules:/app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    networks:
      - nstyle-network
    profiles:
      - testing
    command: npm run test:run

volumes:
  test-node-modules:
    driver: local

networks:
  nstyle-network:
    driver: bridge