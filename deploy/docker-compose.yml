version: '3.8'

services:
  # Frontend development
  app-dev:
    image: node:18-alpine
    ports:
      - "8080:8080"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    networks:
      - nail-app-network

  # Frontend production
  app-prod:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - nail-app-network
    profiles:
      - production

  # Local Supabase setup
  supabase-db:
    image: supabase/postgres:15.1.0.117
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: postgres
      POSTGRES_PASSWORD: postgres
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ../backend/supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - nail-app-network
    profiles:
      - local-backend

  supabase-api:
    image: supabase/gotrue:v2.99.0
    depends_on:
      - supabase-db
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_MAILER_AUTOCONFIRM: true
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: supabase-mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_USER: fake_mail_user
      GOTRUE_SMTP_PASS: fake_mail_password
      GOTRUE_SMTP_SENDER_NAME: fake_sender
    networks:
      - nail-app-network
    profiles:
      - local-backend

  # Test runner
  test-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    networks:
      - nail-app-network
    profiles:
      - testing

volumes:
  supabase-db-data:
  frontend-node-modules:

networks:
  nail-app-network:
    driver: bridge